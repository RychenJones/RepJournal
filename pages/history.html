<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepJournal — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css">
<link rel="stylesheet" href="/src/styles/global.css">
<link rel="stylesheet" href="/src/styles/history.css">

<script type="module" src="/src/main.js"></script>
<script type="module" src="/src/js/history.js" defer></script>
</head>
<body>

<!-- ============ DESKTOP TOP NAV (shown ≥800px) ============ -->
<header class="topnav">
  <img class="logo" src="/images/logo-dark-theme.png" alt="RepJournal">

  <nav class="nav">
    <a href="/pages/dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="/pages/history.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      History
    </a>
    <a href="/pages/log-workout.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      Log workout
    </a>
    <a href="/pages/profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4.5-6 7-6s5.5 2 7 6"/></svg>
      Profile
    </a>
  </nav>

  <div class="nav-right">
    <div class="avatar">RJ</div>
  </div>
</header>

<!-- ============ MAIN CONTENT (shared by mobile + desktop) ============ -->
<main class="main">

  <div class="main-header">
    <h1 class="greeting">History</h1>
    <p class="greeting-sub" id="history-summary">62 workouts logged</p>
  </div>

  <div class="streak-row">
    <div class="streak-chip"><div class="num">3</div><div class="lbl">this week</div></div>
    <div class="streak-chip"><div class="num">9</div><div class="lbl">per month</div></div>
    <div class="streak-chip"><div class="num">62</div><div class="lbl">total logged</div></div>
  </div>

  <div id="history-groups" class="history-groups">
    <!-- month groups + workout entries injected by history.js -->
  </div>

  <p id="empty-state" class="empty-state" hidden>No workouts logged yet — head to Log workout to start your streak.</p>

</main>

<!-- ============ TEMPLATES (cloned by history.js) ============ -->
<template id="month-group-template">
  <section class="month-group">
    <h2 class="section-title month-title"></h2>
    <div class="chalk-underline"></div>
    <div class="month-entries"></div>
  </section>
</template>

<template id="history-entry-template">
  <article class="history-entry">
    <button type="button" class="entry-summary">
      <span class="entry-day"></span>
      <span class="entry-body">
        <span class="entry-title"></span>
        <span class="entry-meta"></span>
      </span>
      <svg class="entry-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="entry-detail">
      <div class="entry-exercises"></div>
    </div>
  </article>
</template>

<template id="detail-exercise-template">
  <div class="detail-exercise">
    <h3 class="detail-exercise-name"></h3>
    <div class="detail-set-list"></div>
  </div>
</template>

<template id="detail-set-template">
  <div class="detail-set">
    <span class="detail-set-num"></span>
    <span class="detail-set-line"></span>
  </div>
</template>

<!-- ============ MOBILE BOTTOM NAV (shown <800px) ============ -->
<nav class="bottom-nav">
  <a href="/pages/dashboard.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
  <a href="/pages/history.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    History
  </a>
  <a href="/pages/log-workout.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    Log
  </a>
  <a href="/pages/profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4.5-6 7-6s5.5 2 7 6"/></svg>
    Profile
  </a>
</nav>

</body>
</html>
