<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepJournal — Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/login+create-account.css" />

    <script type="module" src="/src/js/login.js"></script>

    <link
      rel="apple-touch-icon"
      href="/images/favicon_io/apple-touch-icon.png"
    />
    <link rel="icon" type="image/png" href="/images/favicon_io/favicon.ico" />
  </head>
  <body class="login-body">
    <main class="login-main">
      <div class="login-card">
        <div class="login-mark">
          <img
            class="logo login-logo"
            src="/images/logo-dark-theme.png"
            alt="RepJournal"
          />
        </div>
        <p class="login-sub">Log your sets. Keep the streak going.</p>

        <form class="login-form" novalidate>
          <label class="field">
            <span class="field-label">Username</span>
            <input
              class="field-input"
              id="username"
              type="text"
              name="username"
              placeholder="yourusername"
              autocomplete="username"
              required
            />
            <span
              class="field-error"
              id="username-error"
              aria-live="polite"
            ></span>
          </label>

          <label class="field">
            <span class="field-label">Password</span>
            <input
              class="field-input"
              id="password"
              type="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <span
              class="field-error"
              id="password-error"
              aria-live="polite"
            ></span>
          </label>

          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            <span>Stay logged in</span>
          </label>

          <button type="submit" class="login-btn">Log in</button>
        </form>

        <p class="signup-line">
          New here?
          <a href="/src/test.html" class="signup-link"
            >Create an account</a
          >
        </p>
      </div>
    </main>
  </body>
</html>
